server:
  # Private validating recursive resolver used only by the SpamHop network.
  directory: "/opt/unbound/etc/unbound"
  interface: 0.0.0.0@53
  port: 53
  username: "_unbound"
  chroot: "/opt/unbound/etc/unbound"
  do-daemonize: no

  do-ip4: yes
  do-ip6: no
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes

  # Docker bridge networks are private; this service publishes no host port.
  access-control: 127.0.0.1/32 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  auto-trust-anchor-file: "var/root.key"
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-large-queries: yes
  harden-short-bufsize: yes
  qname-minimisation: yes
  prefetch: yes
  prefetch-key: yes
  aggressive-nsec: yes
  edns-buffer-size: 1232
  rrset-roundrobin: yes
  logfile: /dev/null

  # Recursive mode: intentionally no forward-zone is configured.

remote-control:
  control-enable: no
